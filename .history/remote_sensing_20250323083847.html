<!DOCTYPE html>
<html>
<head>
    <title>Remote Sensing Data Viewer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .layer-control {
            margin: 5px 0;
        }
        .layer-control label {
            display: block;
            margin-bottom: 5px;
        }
        .layer-control select {
            width: 200px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
            margin: 5px 0;
            cursor: pointer;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <h3>数据源选择</h3>
        <div class="layer-control">
            <label>卫星影像:</label>
            <select id="satellite">
                <option value="google">Google Maps</option>
                <option value="bing">Bing Maps</option>
                <option value="esri">ESRI World Imagery</option>
            </select>
        </div>
        <div class="layer-control">
            <label>地形数据:</label>
            <select id="terrain">
                <option value="none">无</option>
                <option value="terrain">OpenTopoMap</option>
                <option value="contour">等高线</option>
            </select>
        </div>
        <div class="layer-control">
            <label>NDVI:</label>
            <select id="ndvi">
                <option value="none">无</option>
                <option value="sentinel">Sentinel-2</option>
                <option value="landsat">Landsat 8</option>
            </select>
        </div>
        <button onclick="toggleDraw()">绘制工具</button>
        <button onclick="clearDrawings()">清除绘制</button>
    </div>
    <div id="info">
        <p>坐标: <span id="coordinates"></span></p>
        <p>缩放级别: <span id="zoom"></span></p>
    </div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="remote_sensing.js"></script>
</body>
</html>
