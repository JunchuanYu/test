<!DOCTYPE html>
<html>
<head>
    <title>2D Physics Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="addBall()">Add Ball</button>
        <button onclick="clearBalls()">Clear All</button>
        <br>
        <label>Gravity: <input type="range" id="gravity" min="0" max="2" step="0.1" value="1"></label>
        <br>
        <label>Elasticity: <input type="range" id="elasticity" min="0" max="1" step="0.1" value="0.8"></label>
    </div>
    <canvas id="canvas"></canvas>
    <script src="physics.js"></script>
</body>
</html>
